name: SEO Search Discovery Checks
on:
  pull_request:
    paths:
      - 'api/seo-landing.js'
      - 'src/seoLandingConfig.js'
      - 'api/sitemap.js'
      - 'src/main.jsx'
      - 'index.html'
      - 'vercel.json'
      - 'scripts/test-seo-landing.mjs'
      - 'package.json'
      - '.github/workflows/seo-discovery-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:seo
      - run: npm run test:naver-blog
      - run: npm run build
      - run: node --check api/seo-landing.js
      - run: node --check api/sitemap.js
